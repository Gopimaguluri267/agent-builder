pack_id: finance-card-servicing
pack_name: "Finance — Credit Card Blocking & Replacement Servicing"
version: "0.1.0"
extends: core
domain: finance
sub_domain: card-servicing

governance_floors:
  risk_tier: Medium        # lower than finance-aml's High — the core action (blocking) is protective and
                            # reversible; risk concentrates in one specific sub-action (reissue-to-new-address),
                            # handled via a non_negotiable control in controls-catalog.json rather than a
                            # blanket High floor for the whole pack. See core/risk-tiers.md for what Medium implies.
  data_classification: Confidential

jurisdictions_supported:
  - US    # regime-rules.md content is grounded in US TILA/FCBA + PCI-DSS (global standard, not jurisdiction-specific)
          # sources — see "Open Gaps" below for what's explicitly not covered

files:
  regime_rules: regime-rules.md
  controls_catalog_md: controls-catalog.md
  controls_catalog_json: controls-catalog.json
  allowlist_md: allowlist.md
  allowlist_json: allowlist.json

description: >
  Knowledge base pack for a customer-facing, self-service credit-card
  blocking/replacement agent. A cardholder reports their card lost or
  stolen; once identity is verified, the agent blocks the card immediately
  (no approval gate needed — this is a protective, reversible action),
  discloses the customer's liability protection under TILA/FCBA, and can
  arrange a replacement to the address on file. Reissuing a replacement to
  a NEW/changed address is the one action gated behind a human-approval /
  step-up-verification control, since it is a known account-takeover
  vector. See regime-rules.md for the specific requirements and sources.

open_gaps:
  - "This pack researches CREDIT cards (TILA/FCBA) specifically. DEBIT cards / electronic fund transfers are governed by a different regime — Regulation E / EFTA (15 U.S.C. §1693g, 12 CFR §1005.6), which has a tiered liability structure ($50/$500/unlimited depending on report timing) rather than TILA/FCBA's flat $50-then-zero structure. A project handling debit cards against this pack would be materially under-covered until a debit-specific regime-rules addendum is written."
  - "EU/UK jurisdiction equivalents (e.g. EU PSD2's liability and strong customer authentication rules) not yet researched — this pack currently only supports jurisdictions: [US]."
